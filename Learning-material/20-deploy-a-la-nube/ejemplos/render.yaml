services:
  - type: web
    name: tienda-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: ENTORNO
        value: production
      - key: DATABASE_URL
        sync: false        # secreto: se carga a mano en el panel, no en el repo
