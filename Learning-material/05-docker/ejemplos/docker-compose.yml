services:
  api:
    build: ./app-python
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://user:pass@db:5432/miapp
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: miapp
    volumes:
      - datos:/var/lib/postgresql/data    # los datos sobreviven al contenedor

volumes:
  datos:
